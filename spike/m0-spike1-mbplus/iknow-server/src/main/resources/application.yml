server:
  port: 8080

spring:
  application:
    name: iknow-spike1
  datasource:
    # 真实 PostgreSQL 16 + pgvector 环境
    url: jdbc:postgresql://localhost:5432/iknow?currentSchema=public
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
